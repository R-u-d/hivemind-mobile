repos:
  - repo: local
    hooks:
      # ── Backend ──────────────────────────────────────────────────────────
      - id: ruff
        name: ruff (api)
        entry: bash -c 'cd api && RUFF=venv/bin/ruff; [ -f "$RUFF" ] || RUFF=venv/Scripts/ruff; $RUFF check .'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false

      - id: pytest
        name: pytest (api)
        entry: bash -c 'cd api && PYTEST=venv/bin/pytest; [ -f "$PYTEST" ] || PYTEST=venv/Scripts/pytest; $PYTEST'
        language: system
        files: ^api/.*\.py$
        pass_filenames: false

      # ── Frontend ─────────────────────────────────────────────────────────
      - id: eslint
        name: eslint (app)
        entry: bash -c 'cd app && npm run lint'
        language: system
        files: ^app/.*\.(ts|tsx)$
        pass_filenames: false

      - id: typecheck
        name: typecheck (app)
        entry: bash -c 'cd app && npm run typecheck'
        language: system
        files: ^app/.*\.(ts|tsx)$
        pass_filenames: false

      - id: jest
        name: jest (app)
        entry: bash -c 'cd app && npm test'
        language: system
        files: ^app/.*\.(ts|tsx)$
        pass_filenames: false
